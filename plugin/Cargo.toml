[package]
name = "class_markers"
version = "0.3.1"
edition = "2021"

[lib]
name = "ClassMarkers"
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
] }

[profile.release]
panic = "abort"

[package]
name = "class_markers"
version = "1.1.1"
edition = "2021"
license = "MIT"

[lib]
name = "ClassMarkers"
# rlib too, so `cargo test` can build and run the unit tests
crate-type = ["cdylib", "rlib"]

[dependencies]
bcdec_rs = "0.2.0"
# Elden Ring structures (params, inventory, event flags, text, allocator, task system), pinned to the
# revision this was written against.
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b" }
image = { version = "0.25.10", default-features = false }
intel_tex_2 = "0.5.0"
miniz_oxide = "0.9.1"
png = "0.18.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
] }

[profile.release]
panic = "abort"

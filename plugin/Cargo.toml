[package]
name = "class_markers"
version = "0.10.2"
edition = "2021"

[lib]
name = "ClassMarkers"
# rlib only so `cargo test` can run the gfx builder test (src/gfx.rs)
crate-type = ["cdylib", "rlib"]

[dependencies]
# Elden Ring structures (inventory, task system), pinned to the revision this was written against.
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b" }
intel_tex_2 = "0.5.0"
miniz_oxide = "0.9.1"
png = "0.18.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
] }

[profile.release]
panic = "abort"

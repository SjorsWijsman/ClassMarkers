[package]
name = "class_markers"
version = "0.5.0"
edition = "2021"

[lib]
name = "ClassMarkers"
crate-type = ["cdylib"]

[dependencies]
# Elden Ring structures (inventory, task system), pinned to the revision this was written against.
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", rev = "59fbd3b" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
] }

[profile.release]
panic = "abort"
